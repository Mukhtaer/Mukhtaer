name: terminal

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/terminal.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terminal
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test
        working-directory: scripts
        run: python -m unittest -v
      - name: Render
        run: python scripts/terminal.py "${{ github.repository_owner }}" assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate
        run: python -c "import sys, xml.etree.ElementTree as ET; [ET.parse(f) for f in sys.argv[1:]]" assets/*.svg
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || { git commit -m "Refresh terminal activity"; git push; }
